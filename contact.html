<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gerardo García Ayala</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado / Menú -->
    <header class="navbar">
        <nav class="nav-links">
            <a href="index.html">HOME</a>
            <a href="about.html">ABOUT ME</a>
            <a href="contact.html">CONTACT</a>
        </nav>

        <h1 class="logo">GERARDO GARCÍA AYALA</h1>

        <div class="social-icons">
            <a href="https://www.instagram.com/TU_USUARIO" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.artstation.com/TU_USUARIO" target="_blank"><i class="fa-brands fa-artstation"></i></a>
        </div>
    </header>

    <!-- Sección de Contacto -->
    <main class="contact-container">
        <h2 class="contact-title">CONTACT</h2>

        <!-- Reemplaza TU_ID_FORMSPREE con la clave de Formspree -->
        <form action="https://formspree.io/f/xdenoyyq" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">NAME *</label>
                <input type="text" id="name" name="name" placeholder="YOUR NAME..." required>
            </div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS *</label>
                <input type="email" id="email" name="email" placeholder="YOUR EMAIL ADDRESS..." required>
            </div>

            <div class="form-group">
                <label for="message">MESSAGE *</label>
                <textarea id="message" name="message" rows="6" placeholder="YOUR MESSAGE..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">SUBMIT</button>
        </form>
    </main>

    <!-- Pie de página -->
    <footer class="footer-social">
        <div class="footer-icons">
            <a href="https://www.instagram.com/TU_USUARIO" target="_blank"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.artstation.com/TU_USUARIO" target="_blank"><i class="fa-brands fa-artstation"></i></a>
        </div>
    </footer>

</body>
</html>
